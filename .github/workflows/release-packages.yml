# TODO: attach built packages to the release page
name: Release Packages
on:
  push:
    tags:
      - v*
jobs:
  package-for-development:
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.event.ref }}
      packageName: package-for-development
      androidBuildArgs: '--android arm64 --android_ndk_api_level 28'
    secrets: inherit

  package-for-production:
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.event.ref }}
      packageName: package-for-production
      androidBuildArgs: '--linkopt="-s" --android arm64 --android_ndk_api_level 28'
    secrets: inherit
