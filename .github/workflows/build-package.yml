name: Build a Package
on:
  workflow_dispatch:
    inputs:
      bazelBuildArgs:
        type: string
        description: A value for `--bazel_build_opts`
        default: '--experimental_scale_timeouts=10.0 --http_timeout_scaling=10.0' 
      androidBuildArgs:
        type: string
        description: Build options for Android Build
        default: '--android fat --android_ndk_api_level 28'
jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.event.ref }}
      packageName: package
      bazelBuildArgs: ${{ inputs.bazelBuildArgs || '--experimental_scale_timeouts=10.0 --http_timeout_scaling=10.0' }}
      androidBuildArgs: ${{ inputs.androidBuildArgs || '--android fat --android_ndk_api_level 28' }}
    secrets: inherit
